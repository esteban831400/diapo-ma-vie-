<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --honey:#E8A33D; --amber:#C97A1E; --cream:#FFF6EA; --rose:#F3D6D8; --choc:#4A2C20;
  --u:min(6.25vw,11.111vh);                       /* 1u = 1/16 of a 16:9 frame */
  --serif:'Playfair Display','Bodoni Moda',Georgia,'Times New Roman',serif;
  --sans:'Inter','Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-body:max(13px,calc(var(--u)*.19));
  --fs-small:max(11px,calc(var(--u)*.145));
  --line:rgba(201,122,30,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--choc);
  font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#FFFaF2 0%,#FBE8D6 55%,#F3D6D8 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(201,122,30,.13) 100%)}
#veil{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,246,234,.95),rgba(255,236,210,.55) 70%)}
#sweep{position:fixed;top:-10%;bottom:-10%;left:0;width:70vw;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,236,190,.0) 38%,rgba(255,248,230,.85) 50%,rgba(255,236,190,.0) 62%,transparent 70%);
  filter:blur(6px);transform:translateX(-100%) skewX(-12deg)}

/* ---------- slides ---------- */
.slide{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.slide.active{display:flex}
.frame{position:relative;width:calc(var(--u)*16);height:calc(var(--u)*9);display:flex;flex-direction:column;align-items:center;
  text-align:center;padding-top:calc(var(--u)*.8)}
.overlay{position:absolute;inset:0;pointer-events:none}
[data-step]{visibility:hidden;opacity:0}

.eyebrow{font-size:var(--fs-small);letter-spacing:.42em;text-transform:uppercase;color:var(--amber);font-weight:400;margin:0}
.title{font-family:var(--serif);font-weight:500;font-size:max(22px,calc(var(--u)*.5));line-height:1.12;margin:calc(var(--u)*.14) 0 0;
  letter-spacing:.005em;max-width:calc(var(--u)*13)}
.lead{font-size:var(--fs-body);line-height:1.75;max-width:calc(var(--u)*8.6);margin:calc(var(--u)*.2) 0 0;color:rgba(74,44,32,.82)}
.gold-text{background:linear-gradient(100deg,#A85D0C 0%,#D98A25 28%,#F5BB52 50%,#D98A25 72%,#A85D0C 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.brand{font-family:var(--serif);font-style:italic;font-weight:400;font-size:max(30px,calc(var(--u)*.95));line-height:1.1;margin-top:calc(var(--u)*.4)}
.rule{width:calc(var(--u)*1.2);height:1px;background:linear-gradient(90deg,transparent,var(--honey),transparent);margin:calc(var(--u)*.22) auto 0}

.glass{background:linear-gradient(140deg,rgba(255,255,255,.62),rgba(255,246,234,.28) 55%,rgba(243,214,216,.32));
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.75);border-radius:calc(var(--u)*.26);
  box-shadow:0 calc(var(--u)*.25) calc(var(--u)*.7) rgba(201,122,30,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(232,163,61,.18)}

/* slide 1 : timeline tags */
.tag{position:absolute;left:0;top:0;will-change:transform;width:calc(var(--u)*3.4);text-align:center}
.tag-in .date{font-family:var(--serif);font-size:max(20px,calc(var(--u)*.42));font-weight:500;color:var(--amber)}
.tag-in .cap{font-size:var(--fs-small);letter-spacing:.06em;margin-top:.2em;color:rgba(74,44,32,.78);line-height:1.5}

/* slide 2 : org chart */
.f2 .title{font-size:max(20px,calc(var(--u)*.4))}
#orgWrap{position:absolute;left:0;right:0;top:calc(var(--u)*1.75);bottom:calc(var(--u)*.7);display:flex;justify-content:center;overflow:visible}
.tree{transform-origin:top center;pointer-events:none}
.tree ul{display:flex;justify-content:center;margin:0;padding:calc(var(--u)*.55) 0 0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*.55) calc(var(--u)*.12) 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:calc(var(--u)*.55);border-top:1.5px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line)}
.tree li:only-child::before{display:none}
.tree li:only-child::after{border-top:0;width:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid var(--line);border-radius:0 calc(var(--u)*.14) 0 0}
.tree li:first-child::after{border-radius:calc(var(--u)*.14) 0 0 0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:1.5px solid var(--line);height:calc(var(--u)*.55)}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.card{position:relative;pointer-events:auto;width:calc(var(--u)*1.95);height:calc(var(--u)*1.12);padding:calc(var(--u)*.1) calc(var(--u)*.12);
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.05);cursor:text;transition:box-shadow .3s,transform .3s}
.card.l0{width:calc(var(--u)*2.7)}
.card.l1{width:calc(var(--u)*2.3)}
.card:hover,.card:focus-within{transform:translateY(-2px);box-shadow:0 calc(var(--u)*.3) calc(var(--u)*.8) rgba(201,122,30,.28),inset 0 1px 0 #fff}
.card .nm,.card .rl{outline:none;min-height:1.2em;cursor:text;word-break:break-word;border-radius:6px;user-select:text;-webkit-user-select:text}
.card .nm{font-family:var(--serif);font-weight:500;font-size:max(12px,calc(var(--u)*.2))}
.card .rl{font-size:max(9px,calc(var(--u)*.125));letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:400}
.card [data-ph]:empty::before{content:attr(data-ph);color:rgba(74,44,32,.3);font-style:italic;text-transform:none;letter-spacing:.04em;pointer-events:none}
.card .nm:focus,.card .rl:focus{background:rgba(255,255,255,.55)}
.ctl{position:absolute;width:calc(var(--u)*.3);height:calc(var(--u)*.3);min-width:18px;min-height:18px;border-radius:50%;border:1px solid rgba(201,122,30,.5);
  background:rgba(255,250,242,.95);color:var(--amber);font:400 max(11px,calc(var(--u)*.2))/1 var(--sans);padding:0;cursor:pointer;
  opacity:0;transform:scale(.7);transition:.25s;display:flex;align-items:center;justify-content:center}
.card:hover .ctl,.card:focus-within .ctl{opacity:1;transform:scale(1)}
.ctl:hover{background:var(--honey);color:#fff}
.ctl.del{top:-9px;right:-9px}
.ctl.child{bottom:-10px;left:50%;margin-left:-.5em}
.ctl.sib{right:-10px;top:50%;margin-top:-.5em}
.orgtools{position:absolute;right:calc(var(--u)*.3);bottom:calc(var(--u)*.1);pointer-events:auto;display:flex;gap:calc(var(--u)*.2)}
.orgtools button{background:none;border:0;font:300 var(--fs-small) var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(74,44,32,.45);cursor:pointer;padding:6px}
.orgtools button:hover{color:var(--amber)}

/* slide 3 */
.blocks{position:absolute;left:calc(var(--u)*1.1);right:calc(var(--u)*1.1);bottom:calc(var(--u)*.7);display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.35)}
.block{padding:calc(var(--u)*.3) calc(var(--u)*.38);text-align:left}
.block .lbl{font-size:var(--fs-small);letter-spacing:.34em;text-transform:uppercase;color:var(--amber);font-weight:400}
.block .txt{margin-top:calc(var(--u)*.14);font-size:var(--fs-body);line-height:1.6;color:rgba(74,44,32,.86)}
.f3 .title{max-width:calc(var(--u)*14)}

/* slide 4 */
.f4{align-items:flex-start;text-align:left}
.f4 .right{position:absolute;left:calc(var(--u)*7.9);right:calc(var(--u)*1.1);top:calc(var(--u)*1.2)}
.f4 .title{font-size:max(22px,calc(var(--u)*.46))}
.job{font-family:var(--serif);font-style:italic;font-weight:400;font-size:max(22px,calc(var(--u)*.62));margin-top:calc(var(--u)*.3);line-height:1.15}
.missions{list-style:none;margin:calc(var(--u)*.5) 0 0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*.26)}
.missions li{display:flex;gap:calc(var(--u)*.3);align-items:baseline;font-size:var(--fs-body);line-height:1.6;color:rgba(74,44,32,.88);
  padding-bottom:calc(var(--u)*.22);border-bottom:1px solid rgba(201,122,30,.22)}
.missions .num{font-family:var(--serif);font-size:max(16px,calc(var(--u)*.3));color:var(--amber);min-width:1.6em}

/* slide 5 */
.stylebox .k{font-size:var(--fs-small);letter-spacing:.34em;text-transform:uppercase;color:var(--amber);margin-top:calc(var(--u)*.3);font-weight:400}
.stylebox .v{font-family:var(--serif);font-style:italic;font-size:max(26px,calc(var(--u)*.7));line-height:1.1;margin-top:calc(var(--u)*.06)}
.stylebox .d{font-size:var(--fs-body);color:rgba(74,44,32,.78);margin-top:calc(var(--u)*.08);max-width:calc(var(--u)*7)}
.col{position:absolute;top:calc(var(--u)*4.1);width:calc(var(--u)*4.7);padding:calc(var(--u)*.3) calc(var(--u)*.4);text-align:left}
.col.left{left:calc(var(--u)*1);} .col.right{right:calc(var(--u)*1)}
.col h3{margin:0 0 calc(var(--u)*.2);font-family:var(--serif);font-weight:500;font-size:max(17px,calc(var(--u)*.3))}
.col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.16)}
.col li{font-size:var(--fs-body);line-height:1.5;padding-left:1.5em;position:relative;color:rgba(74,44,32,.88)}
.col li::before{content:'';position:absolute;left:.1em;top:.62em;width:.55em;height:.55em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE2A6,#E8A33D 55%,#C97A1E)}
.col.right li::before{background:radial-gradient(circle at 35% 30%,#fff,#F3D6D8 55%,#D9A0A8)}

/* slide 6 */
.cards{position:absolute;right:calc(var(--u)*1);top:calc(var(--u)*2.3);width:calc(var(--u)*8);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.3)}
.sug{padding:calc(var(--u)*.3) calc(var(--u)*.34);text-align:left;min-height:calc(var(--u)*2.6)}
.sug .n{font-family:var(--serif);font-size:max(16px,calc(var(--u)*.34));color:var(--amber)}
.sug h3{margin:calc(var(--u)*.08) 0 calc(var(--u)*.1);font-family:var(--serif);font-weight:500;font-size:max(15px,calc(var(--u)*.27));line-height:1.2}
.sug p{margin:0;font-size:var(--fs-small);line-height:1.65;color:rgba(74,44,32,.82);letter-spacing:.01em}

/* slide 7 */
.f7{justify-content:center;padding-top:0}
.thanks{font-family:var(--serif);font-weight:500;font-size:max(46px,calc(var(--u)*1.9));margin:0;line-height:1.05;white-space:nowrap}
.thanks .ch{display:inline-block;background:linear-gradient(100deg,#A85D0C 0%,#D98A25 28%,#F7C566 50%,#D98A25 72%,#A85D0C 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s linear infinite;animation-delay:calc(var(--i)*-.22s)}
.thanks .sp{display:inline-block;width:.32em}
.sub{font-size:max(14px,calc(var(--u)*.26));letter-spacing:.5em;text-transform:uppercase;font-weight:300;margin-top:calc(var(--u)*.45);color:var(--choc)}

/* HUD (prev / counter / next) */
#hud{position:fixed;left:50%;bottom:max(6px,1.2vh);transform:translateX(-50%);z-index:30;display:flex;align-items:center;pointer-events:none;
  font-size:max(11px,calc(var(--u)*.15));letter-spacing:.34em;color:rgba(74,44,32,.6);font-weight:300}
#hud button{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:.5em;height:max(36px,calc(var(--u)*.46));min-width:max(36px,calc(var(--u)*.46));
  padding:0 .8em;background:none;border:0;border-radius:999px;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;
  transition:background .25s,color .25s,opacity .25s;-webkit-tap-highlight-color:transparent}
#hud button:hover,#hud button:focus-visible{background:rgba(255,255,255,.65);color:var(--amber);outline:none}
#hud button:disabled{opacity:.2;pointer-events:none}
#hud svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#hud b{font-weight:400;color:var(--amber)}
#hint{position:fixed;left:0;right:0;bottom:max(46px,6.6vh);z-index:25;text-align:center;pointer-events:none;padding:0 12px;
  font-size:max(10px,calc(var(--u)*.12));letter-spacing:.3em;text-transform:uppercase;color:rgba(74,44,32,.45);transition:opacity 1s}

/* slide menu */
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:0 4vw 6vh;
  background:rgba(255,246,234,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s,visibility .45s}
#menu.open{opacity:1;visibility:visible;pointer-events:auto}
.menu-panel{--g:calc(var(--u)*.2);width:min(94vw,calc(var(--u)*13.6));padding:calc(var(--u)*.42) calc(var(--u)*.5) calc(var(--u)*.5);text-align:center;
  transform:translateY(16px) scale(.98);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#menu.open .menu-panel{transform:none}
.menu-title{font-size:var(--fs-small);letter-spacing:.42em;text-transform:uppercase;color:var(--amber);font-weight:400;margin-bottom:calc(var(--u)*.3)}
.menu-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g)}
.menu-item{flex:0 0 calc((100% - 3*var(--g))/4);display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.08);text-align:left;cursor:pointer;
  min-height:calc(var(--u)*1.45);padding:calc(var(--u)*.22) calc(var(--u)*.26);font:inherit;color:var(--choc);
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);border-radius:calc(var(--u)*.18);
  transition:transform .3s,box-shadow .3s,background .3s,border-color .3s;-webkit-tap-highlight-color:transparent}
.menu-item:hover,.menu-item:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.88);outline:none;box-shadow:0 calc(var(--u)*.18) calc(var(--u)*.45) rgba(201,122,30,.22)}
.menu-item.cur{border-color:var(--honey);box-shadow:inset 0 0 0 1px var(--honey)}
.mi-n{font-family:var(--serif);font-size:max(15px,calc(var(--u)*.3));color:var(--amber);line-height:1}
.mi-t{font-size:max(11px,calc(var(--u)*.15));line-height:1.35;color:rgba(74,44,32,.88)}
#noWebgl{display:none;position:fixed;top:10px;left:10px;font-size:11px;opacity:.5}

@media (max-aspect-ratio:1/1){
  :root{--u:11.111vw;--fs-body:15px;--fs-small:12px}
  .frame{width:100vw;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;padding:56px 22px 70px;pointer-events:auto;justify-content:flex-start}
  .title{max-width:100%}
  .f4 .right,.cards,.blocks,.col{position:static;width:100%;left:auto;right:auto;display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .f4{align-items:center;text-align:center}.f4 .right{margin-top:34vh}
  .f5 .stylebox{margin-top:26vh}.f3 .blocks{margin-top:34vh}.f6 .cards{margin-top:34vh}.f5 .col{margin-top:10px}
  #orgWrap{position:static;margin-top:20px;height:62vh;justify-content:center}
  .tag{width:30vw}
  .menu-item{flex-basis:calc((100% - var(--g))/2)}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="slides"></div>
<div id="veil"></div>
<div id="sweep"></div>
<div id="menu" aria-hidden="true"><div class="menu-panel glass"><div class="menu-title"></div><div class="menu-grid"></div></div></div>
<div id="hint"></div>
<nav id="hud" aria-label="Slide navigation">
  <button type="button" id="prevBtn" aria-label="Previous slide" title="Previous slide (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" id="menuBtn" aria-label="All slides" title="All slides (M)"><b id="cur">1</b><span>/</span><span id="tot">7</span></button>
  <button type="button" id="nextBtn" aria-label="Next slide" title="Next slide (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

}}
</script>

function fitTree() {
  const wrap = $('#orgWrap'); if (!wrap || !wrap.offsetWidth) return;

  const k = Math.min(1, (wrap.clientWidth - 20) / treeEl.scrollWidth, wrap.clientHeight / treeEl.scrollHeight);
  treeEl.style.transform = `scale(${k})`;
}
function plain(el, node, key) {
  el.contentEditable = 'true'; el.spellcheck = false; el.textContent = node[key] || '';
  el.addEventListener('input', () => { if (!el.textContent.trim()) el.innerHTML = ''; node[key] = el.textContent; saveTree(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); el.blur(); } e.stopPropagation(); });
  el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ')); });
}
function renderTree() {
  treeEl.innerHTML = '';

    const li = document.createElement('li');
    const card = document.createElement('div'); card.className = `card glass l${depth}`;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.dataset.ph = 'Name'; plain(nm, node, 'name');
    const rl = document.createElement('div'); rl.className = 'rl'; rl.dataset.ph = 'Position'; plain(rl, node, 'role');
    card.append(nm, rl);
    const btn = (cls, txt, title, fn) => { const b = document.createElement('button'); b.className = 'ctl ' + cls; b.textContent = txt; b.title = title; b.tabIndex = -1;
      b.addEventListener('click', e => { e.stopPropagation(); fn(); saveTree(); renderTree(); }); card.appendChild(b); };
    if (parent) { btn('del', '×', 'Remove this box', () => { parent.children.splice(parent.children.indexOf(node), 1); });
                  btn('sib', '+', 'Add a box beside', () => { parent.children.splice(parent.children.indexOf(node) + 1, 0, { name: '', role: '' }); }); }
    if (depth < 2) btn('child', '+', 'Add a box below', () => { (node.children = node.children || []).push({ name: '', role: '' }); });
    li.appendChild(card);
    if (node.children && node.children.length) { const ul = document.createElement('ul'); node.children.forEach(c => ul.appendChild(build(c, depth + 1, node))); li.appendChild(ul); }
    return li;
  };
  const ul = document.createElement('ul'); ul.appendChild(build(tree, 0, null)); treeEl.appendChild(ul);
  requestAnimationFrame(fitTree);
}

      const x = (proj.x * .5 + .5) * innerWidth, y = (-proj.y * .5 + .5) * innerHeight; el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,0)`; });
  }

  /* ---------- loop ---------- */
  const clock = new THREE.Clock(); let last = 0;
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime(), dt = Math.min(.05, t - last); last = t;
    pointer.sx += (pointer.x - pointer.sx) * .04; pointer.sy += (pointer.y - pointer.sy) * .04;
    camera.position.set(cam.x + pointer.sx * .5, cam.y - pointer.sy * .3 + Math.sin(t * .3) * .12, cam.z); camera.lookAt(cam.x, 0, 0);
    if (Math.abs(camera.fov - cam.fov) > .01) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
    bokeh.uniforms.uTime.value = t; bokeh.uniforms.uCamX.value = cam.x;
    worlds.forEach(w => { if (w.root.visible) w.update(t, dt); });
    trackTags(); renderer.render(scene, camera);
  });

  return { worlds, THREE,
    setVisible(set) { worlds.forEach((w, i) => { w.root.visible = set.includes(i); }); },
    applyBlur(b) { canvas.style.filter = b > .3 ? `blur(${b.toFixed(1)}px)` : 'none'; } };
}

/* ---------------------------------------------------------------------
   Navigation / transitions
   --------------------------------------------------------------------- */
let step = 0, busy = false, pending = null;       // pending = slide asked for while a transition is running
const hud = $('#cur'), hint = $('#hint'), UI = C.ui;
hint.textContent = UI.hint;
const worldOf = i => engine && engine.worlds[i];
const camX = i => i * SPACING;
function setBlur(b) { fx.blur = b; engine && engine.applyBlur(b); }

function revealStep(i, n, instant) {
  $$(`[data-step="${n}"]`, slides[i]).forEach(el => {
    gsap.killTweensOf(el);
    if (instant) gsap.set(el, { autoAlpha: 1, y: 0, scale: 1, filter: 'none' });
    else gsap.fromTo(el, { autoAlpha: 0, y: 26, scale: .95, filter: 'blur(12px)' }, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 1, ease: 'power3.out', clearProps: 'filter' });
  });
  const w = worldOf(i); w && w.setStep(n, instant);
}
function showSlide(i, { all = false, delay = 0 } = {}) {
  const s = slides[i]; s.classList.add('active');
  const kids = [...s.children]; gsap.killTweensOf(kids); gsap.set(kids, { clearProps: 'all' });
  $$('[data-step]', s).forEach(el => { gsap.killTweensOf(el); gsap.set(el, { autoAlpha: 0 }); });
  gsap.fromTo($$('.in', s), { autoAlpha: 0, y: 38, scale: .97, filter: 'blur(14px)' }, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 1.3, ease: 'power3.out', stagger: .13, delay, clearProps: 'filter' });
  const w = worldOf(i); w && w.enter();
  if (i === 1) requestAnimationFrame(fitTree);
  step = 0;
  if (all) { for (let n = 1; n <= stepsOf[i]; n++) revealStep(i, n, true); step = stepsOf[i]; }
}
function setHud(i) {
  gsap.fromTo(hud, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .8, ease: 'power2.out' }); hud.textContent = i + 1;
  $('#prevBtn').disabled = i === 0; $('#nextBtn').disabled = i === N - 1;
  $$('.menu-item').forEach((b, k) => b.classList.toggle('cur', k === i));
  try { history.replaceState(null, '', i === 0 ? location.pathname + location.search : '#' + (i + 1)); } catch (e) {}   // lets a reload / bookmark land on the same slide
}
function flashHint(text, ms = 7000) { hint.textContent = text; hint.style.opacity = 1; clearTimeout(flashHint.t); flashHint.t = setTimeout(() => { hint.style.opacity = 0; }, ms); }

function goTo(next, back = false, { all = back } = {}) {
  if (busy || next < 0 || next >= N || next === current) return;
  busy = true; hint.style.opacity = 0;
  const from = current, old = slides[from], dur = 1.9;
  engine && engine.setVisible([from, next]);
  const baseFrom = (worldOf(from) || {}).baseBlur || 0, baseTo = (worldOf(next) || {}).baseBlur || 0;
  const sweep = $('#sweep'), veil = $('#veil');
  const tl = gsap.timeline({ onComplete() { busy = false; if (pending !== null) { const p = pending; pending = null; jumpTo(p); } } });
  /* text out */
  tl.to([...old.children], { autoAlpha: 0, scale: back ? .96 : 1.06, filter: 'blur(18px)', duration: .75, ease: 'power2.in' }, 0);
  tl.add(() => { old.classList.remove('active'); gsap.set([...old.children], { clearProps: 'all' }); }, .78);
  /* 3D camera travel: dolly-in + blur, cut to next scene, settle */
  tl.to(cam, { x: camX(next), duration: dur, ease: 'power3.inOut' }, 0);
  tl.to(cam, { z: 8.8, fov: 38, duration: dur * .45, ease: 'power2.in' }, 0).to(cam, { z: 14, fov: 32, duration: dur * .55, ease: 'power2.out' }, dur * .45);
  tl.to(cam, { y: back ? -1 : 1, duration: dur / 2, ease: 'sine.inOut' }, 0).to(cam, { y: 0, duration: dur / 2, ease: 'sine.inOut' }, dur / 2);
  tl.to(fx, { blur: 18, duration: dur * .42, ease: 'power2.in', onUpdate: () => setBlur(fx.blur) }, 0).to(fx, { blur: baseTo, duration: dur * .58, ease: 'power2.out', onUpdate: () => setBlur(fx.blur) }, dur * .42);
  /* cinematic light sweep + soft fade */
  tl.fromTo(sweep, { x: back ? '120vw' : '-70vw', opacity: 1 }, { x: back ? '-70vw' : '120vw', duration: 1.25, ease: 'power2.inOut' }, dur * .22).set(sweep, { opacity: 0 }, dur * .22 + 1.26);
  tl.to(veil, { opacity: .55, duration: dur * .4, ease: 'sine.in' }, dur * .1).to(veil, { opacity: 0, duration: dur * .5, ease: 'sine.out' }, dur * .5);
  /* new scene */
  tl.add(() => { current = next; setHud(next); showSlide(next, { all }); if (next === N - 1) flashHint(UI.lastHint); }, dur * .62);
  tl.add(() => { engine && engine.setVisible([next]); }, dur + .05);
}
function next() {
  if (busy) return;
  if (step < stepsOf[current]) { step++; revealStep(current, step); }
  else if (current < N - 1) goTo(current + 1);
}
function prev() { if (!busy && current > 0) goTo(current - 1, true); }
/* jump straight to any slide (menu, number keys, Home / End): the slide is shown complete, ready for questions */
function jumpTo(i) {
  closeMenu();
  if (!(i >= 0 && i < N)) return;
  if (busy) { pending = i; return; }
  if (i === current) { while (step < stepsOf[current]) { step++; revealStep(current, step); } return; }
  goTo(i, i < current, { all: true });
}

/* slide menu (click the counter, or press M / Esc) */
const menuEl = $('#menu'); let menuOpen = false;
$('.menu-title', menuEl).textContent = UI.menuTitle;
$('.menu-grid', menuEl).innerHTML = [C.s1, C.s2, C.s3, C.s4, C.s5, C.s6, C.s7].map((sl, i) =>
  `<button type="button" class="menu-item" data-i="${i}"><span class="mi-n">0${i + 1}</span><span class="mi-t">${esc(sl.title)}</span></button>`).join('');
function openMenu() {
  if (menuOpen) return; menuOpen = true; menuEl.classList.add('open'); menuEl.setAttribute('aria-hidden', 'false');
  $$('.menu-item', menuEl).forEach((b, k) => b.classList.toggle('cur', k === current));
  gsap.fromTo($$('.menu-item', menuEl), { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .55, ease: 'power3.out', stagger: .04, delay: .08 });
  setTimeout(() => { const c = $('.menu-item.cur', menuEl); c && menuOpen && c.focus({ preventScroll: true }); }, 140);
}
function closeMenu() {
  if (!menuOpen) return; menuOpen = false; menuEl.classList.remove('open'); menuEl.setAttribute('aria-hidden', 'true');
  const a = document.activeElement; a && a.blur && a.blur();
}
const toggleMenu = () => menuOpen ? closeMenu() : openMenu();
function moveMenuFocus(d) {
  const items = $$('.menu-item', menuEl); let i = items.indexOf(document.activeElement); if (i < 0) i = current;
  items[(i + d + items.length) % items.length].focus({ preventScroll: true });
}
menuEl.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('.menu-item');
  if (b) jumpTo(+b.dataset.i); else if (!e.target.closest('.menu-panel')) closeMenu();
});
$('#hud').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('button'); if (!b) return; b.blur();
  if (b.id === 'menuBtn') toggleMenu();
  else { closeMenu(); b.id === 'prevBtn' ? prev() : next(); }
});

/* ---------------------------------------------------------------------
   Inputs
   --------------------------------------------------------------------- */
const editing = e => { const t = e.target; return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); };
addEventListener('keydown', e => {
  if (editing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, num = /^[1-9]$/.test(k) && +k <= N ? +k - 1 : -1;
  if (menuOpen) {
    if (k === 'Escape' || k === 'm' || k === 'M') { e.preventDefault(); closeMenu(); }
    else if (num >= 0) { e.preventDefault(); jumpTo(num); }
    else if (k.startsWith('Arrow')) { e.preventDefault(); moveMenuFocus(k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1); }
    return;                                                  // Enter / Space activate the focused slide natively
  }
  if ((k === ' ' || k === 'Enter') && e.target.closest && e.target.closest('button')) return;   // a focused button keeps its own behaviour
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (num >= 0) { e.preventDefault(); jumpTo(num); }        // 1 … 7 : show that slide
  else if (k === 'Home') jumpTo(0);
  else if (k === 'End') jumpTo(N - 1);
  else if (k === 'Escape' || k === 'm' || k === 'M') { e.preventDefault(); openMenu(); }
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
});
let wasEditing = false, swiped = 0;
addEventListener('pointerdown', () => { const a = document.activeElement; wasEditing = !!(a && a.isContentEditable); }, true);
addEventListener('click', e => {
  if (performance.now() - swiped < 450 || menuOpen) return;
  if (e.target.closest('.card, .orgtools, button, a, [contenteditable], #hud, #menu')) return;     // boxes are for typing, not for navigating
  if (wasEditing) { wasEditing = false; return; }                                       // first click outside only leaves the edit mode
  if (e.button === 0) next();
});
let tx = 0, ty = 0, tOK = false;
addEventListener('touchstart', e => { tOK = !menuOpen && !e.target.closest('.card, #hud, #menu'); tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { if (!tOK) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) { swiped = performance.now(); dx < 0 ? next() : prev(); } }, { passive: true });
addEventListener('contextmenu', e => { if (!e.target.closest('[contenteditable]')) e.preventDefault(); });

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
(async () => {
  try { engine = await initEngine(); } catch (err) { console.warn('3D disabled:', err); engine = null; }
  const h = parseInt(location.hash.slice(1), 10), start = h >= 1 && h <= N ? h - 1 : 0;      // e.g. index.html#5 opens slide 5
  current = start; cam.x = camX(start);
  if (engine) { engine.setVisible([start]); setBlur((worldOf(start) || {}).baseBlur || 0); }
  setHud(start); showSlide(start, { delay: .5, all: start > 0 });
  if (start === N - 1) flashHint(UI.lastHint);
  addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= N && n - 1 !== current) jumpTo(n - 1); });
  window.__deck = { next, prev, goTo, jumpTo, openMenu, closeMenu, get state() { return { current, step, busy, menu: menuOpen, steps: stepsOf, engine: !!engine }; } };
})();
</script>
</body>
</html>
